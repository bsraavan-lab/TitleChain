<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TitleChain{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/logo-mark.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">
      <img src="/static/logo-mark.png" alt="" width="22" height="25" class="mark">
      <span>TitleChain</span>
    </a>
    <span class="topbar-right">
      {% block topbar %}{% endblock %}
      <span class="meta">rulebook {{ RULEBOOK_VERSION }}</span>
    </span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
