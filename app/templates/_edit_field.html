{# Inline. No save button, therefore no unsaved state: Enter commits, Escape
   restores. The POST re-runs derive() server-side and swaps the derived panel —
   that re-derivation IS the memory proof, not a stand-in for it. #}
<form class="edit-inline" hx-post="/correct" hx-target="#derived" hx-swap="outerHTML">
  <input type="hidden" name="entry_id" value="{{ entry_id }}">
  <input type="hidden" name="field" value="{{ field }}">
  <input type="hidden" name="case_id" value="{{ case_id }}">
  <label class="sr-only" for="v-{{ entry_id }}-{{ field }}">{{ label }}</label>
  <input id="v-{{ entry_id }}-{{ field }}" name="value" value="{{ value or '' }}"
         autofocus autocomplete="off" placeholder="{{ label }}"
         hx-get="/entry/{{ entry_id }}/cell/{{ field }}"
         hx-trigger="keyup[key=='Escape']"
         hx-target="closest td" hx-swap="innerHTML">
  <button class="btn-tiny" type="submit">save</button>
</form>
