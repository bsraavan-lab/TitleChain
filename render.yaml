# Render Blueprint — the app runs here, as one process, exactly as it does
# locally. Vercel sits in front of this and proxies (see vercel.json).
#
# One process is not incidental: pipeline.run() is a background thread that
# outlives the request that started it, and the case page polls for its status.
# A second instance would poll a thread it cannot see. Do not add workers, do
# not enable autoscaling.
services:
  - type: web
    name: titlechain
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Not `/`: that was a full Jinja render of the home screen on every probe,
    # and after the cutover `/` is served by Vercel rather than from here.
    # /api/health opens the database and returns, which is what "alive" means
    # for this process.
    healthCheckPath: /api/health
    envVars:
      - key: SARVAM_API_KEY
        sync: false          # set in the Render dashboard; never committed
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Empty here on purpose: Vercel and this service are one origin to the
      # browser, so the deployed front end never sends a preflight and the
      # middleware is not installed at all. It is declared so the one host that
      # does need it — a preview serving the bundle without the /api rewrite —
      # is a dashboard value rather than an undocumented surprise. Comma-
      # separated exact origins; a wildcard is not accepted.
      - key: TITLECHAIN_CORS_ORIGINS
        sync: false

    # ── persistence ──────────────────────────────────────────────────────────
    # The free plan has no disk: the filesystem is ephemeral and the instance
    # sleeps after 15 minutes idle. Cases created during a demo survive until
    # the next restart, and the bundled sample digitisations are re-seeded on
    # every boot, so the demo path is always warm.
    #
    # To make cases outlive restarts, move to the paid Starter plan and add a
    # disk — change `plan: free` to `plan: starter` and uncomment:
    #
    # disk:
    #   name: titlechain-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # ...then also set TITLECHAIN_DATA_DIR=/var/data in envVars above.
