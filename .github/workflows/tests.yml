name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches render.yaml. It read 3.13 here against 3.12.7 in production,
      # which is a difference CI exists to not have.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          # Nothing in the suite calls Sarvam yet — the pipeline is monkeypatched
          # at digitise() and extract() — so this is wiring for the first test
          # that does, not a current dependency. config.py reads os.environ before
          # falling back to .env, so no code change is needed to pick it up.
          # Fork PRs get an empty string, not the secret: guard any key-dependent
          # test with skipif rather than assuming it is set, or outside PRs go red.
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}

  # The front end compiles. Without this a broken web/ merges green, because
  # pytest cannot see TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Vercel serves whatever config.json says and never reads the rewrites in
      # vercel.json, so this is the file that decides whether /api reaches
      # FastAPI. If the nitro preset ever drifts back to cloudflare-module the
      # build still succeeds and there is no config.json at all — which would be
      # a green CI and a front end that cannot load a case.
      - name: Deployment routes point at the backend
        run: |
          node scripts/vercel-routes.mjs .vercel/output/config.json
          node -e '
            const c = require("./.vercel/output/config.json");
            const first = c.routes[0];
            if (!first?.dest?.startsWith("http")) {
              throw new Error("first route is not the backend proxy: " + JSON.stringify(first));
            }
            if (c.routes.at(-1)?.dest !== "/__server") {
              throw new Error("SSR catch-all is no longer last");
            }
          '
